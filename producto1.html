<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Producto 1</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <a href="index.html" class="volver-inicio">⟵ Regresar al Inicio</a>

    <header class="header-producto">
        <h1>Producto 1</h1>
    </header>

    <main class="contenedor-producto">

        <div class="producto-detalle">

            <div class="producto-imagen">
                <img src="producto1.jpeg" alt="Prenda 1">
                <p class="precio">$45.00</p>

                <button class="btn-comprar">Comprar ahora</button>
            </div>

            <div class="producto-info">

                <h2 class="titulo-descripcion">Descripción del Producto</h2>

                <p class="descripcion">
                    Jersey de alta calidad, cómodo y perfecto para uso diario. <br>
                    Tela suave, resistente y disponible en múltiples tallas.
                </p>

                <table class="tabla-stock">
                    <caption>Tallas Disponibles</caption>
                    <tr>
                        <th>Talla</th>
                        <th>Número</th>
                    </tr>
                    <tr>
                        <td>S</td>
                        <td>20-21</td>
                    </tr>
                    <tr>
                        <td>M</td>
                        <td>30-31</td>
                    </tr>
                    <tr>
                        <td>L</td>
                        <td>40-41</td>
                    </tr>
                    <tr>
                        <td>XL</td>
                        <td>50-51</td>
                    </tr>
                </table>

            </div>

        </div>

    </main>

    <footer id="pie-de-pagina">
        <p>&copy; 2025 Tienda Urbana</p>
    </footer>

</body>
</html>
