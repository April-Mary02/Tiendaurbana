<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Registro</title>
    <link rel="stylesheet" href="estilos.css"> 
</head>
<body>
    <header id="cabecera-principal">
        <div class="header-contenedor">
            <h1 class="header-titulo">Regístrate a nuestra tienda</h1>
        </div>
    </header>


    <main class="contenedor-principal">

        <a href="index.html" class="volver-inicio">⟵ Regresar al inicio</a>

        

        <form action="#" method="post" class="formulario-registro">
            <fieldset>
                <legend>Información Personal</legend>

                <label for="nombre">Nombre completo:</label>
                <input type="text" id="nombre" name="nombre"><br><br>

                <label for="correo">Correo electrónico:</label>
                <input type="email" id="correo" name="correo"><br><br>

                <label for="fecha-nacimiento">Fecha de nacimiento:</label>
                <input type="date" id="fecha-nacimiento" name="fecha-nacimiento"><br><br>

                <label>Género:</label>
                <input type="radio" id="generom" name="genero"> 
                <label for="generom">Masculino</label>

                <input type="radio" id="generof" name="genero"> 
                <label for="generof">Femenino</label>

                <input type="radio" id="generoo" name="genero"> 
                <label for="generoo">Otro</label><br><br>

                <label for="pais">País:</label>
                <select id="pais" name="pais">
                    <option value="Panamá">Panamá</option>
                    <option value="Costa Rica">Costa Rica</option>
                    <option value="Otro">Otro</option>
                </select><br><br>

                <label for="Comentarios">Comentarios acerca de nuestra tienda :</label>
                <textarea id="Comentarios" name="Comentarios"></textarea><br><br>

                <input type="submit" value="Enviar" class="boton-formulario">
                <input type="reset" value="Limpiar" class="boton-formulario"><br>
            </fieldset>
        </form>

    </main>
<br>
    <footer id="pie-de-pagina">
        <p>&copy; 2025 Mi sitio web - Desarrollado por estudiantes de informática</p>
    </footer>

</body>
</html>
