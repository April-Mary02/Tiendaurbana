<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Prenda 1</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>

<a href="tienda.html" class="volver-inicio">⇦ Volver a la tienda</a>

<div class="prenda-contenedor">

    <!-- Imagen principal -->
    <div class="galeria">
        <img src="pro1.jpeg" class="img-principal">
    </div>

    <!-- Información -->
    <div class="info">
        <h2 class="titulo-prenda">Prenda 1</h2>

        <p class="descripcion-prenda">

        <h3 class="precio-detalle">$25.00</h3>

            <option>M</option>

        <div class="detalles-extra">
            <h4>Detalles del producto:</h4>
            <ul>
                <li>Material: Algodón premium</li>
                <li>Costuras reforzadas</li>
